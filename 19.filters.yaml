- name: demo on filters
  hosts: local
  connection: local
  vars:
    topics: "linux,shell,ansible,Terraform"
    names:
    - satya 
    - narayana
    - tamarana
    topic: ANSIBLE 
  tasks:
    - name: print person name
      debug:
        msg: "Hi, {{ person_name | default('Satya') }}"

    - name: convert string to list
      debug:
        msg: "{{ topics | split(',') | trim}}"

    - name: convert list to string
      debug:
        msg: "{{ names | join(' ')}}"
    
    - name: to lower case
      debug:
        msg: "{{ topic | lower }}"

