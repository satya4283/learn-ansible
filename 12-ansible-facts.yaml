- name: ansible facts demo
  hosts: local
  connection: local
  tasks:
    - name: print ansible_facts
      debug:
        msg: "{{ ansible_facts }}"

    - name: print important ansible_facts
      debug:
        msg: |
          os_family: {{ ansible_facts['os_family'] }}
          private_ip: {{ ansible_facts.default_ipv4.address}}
          private_ip: {{ ansible_facts['default_ipv4']['address']}}
