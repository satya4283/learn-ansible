- name: demo on task level variables
  hosts: local
  connection: local
  vars:
    property: "100acrs"
  tasks:
    - name: print variables
      debug:
        msg: "Hi, I got {{property}} from my father"

    - name: print the vars again
      vars:
        property: "10acrs"
      debug:
        msg: "Hi, I got {{property}} from my father"

