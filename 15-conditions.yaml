- name: check OS is RedHat or not
  hosts: local
  connection: local
  become: yes
  tasks:
    - name: Install nginx in RedHat
      dnf:
        name: nginx
        state: present
      when: ansible_facts.os_family == "RedHat"

    - name: Install nginx in debiuan
      apt:
        name: nginx
        state: present
      when: ansible_facts.os_family == "debeain"



