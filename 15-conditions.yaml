- name: check OS is RedHat or not
  hosts: local
  connection: local
  tasks:
    - name: print the OS 
      debug:
        msg: "OS is redhat"
      when: ansible_facts.os_family == "RedHat"

    - name: print the OS
      debug:
        msg: "OS is debeain"
      when: ansible_facts.os_family == "debeain"